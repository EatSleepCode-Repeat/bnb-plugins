[plugin]
name = "gh"
version = "0.1.0"
description = "GitHub CLI helpers for pull requests and Actions workflows"
author = "Chris Clines"
category = "Git & GitHub"

[[action]]
label = "🐙 View Pull Request Status"
command = "gh pr status"
category = "GitHub"

[[action]]
label = "⚡ View Recent Workflow Runs"
command = "gh run list --limit 5"
category = "GitHub"