[plugin]
name = "docker"
version = "0.1.0"
description = "Docker Compose status, logs, and lifecycle shortcuts"
author = "Chris Clines"
category = "Containers"

[[action]]
label = "🐳 Docker Compose Up (Detached)"
command = "docker compose up -d"
category = "Docker"

[[action]]
label = "🛑 Stop Compose Stack (removes containers)"
command = "docker compose down"
category = "Docker"

[[action]]
label = "📋 Docker Compose Status"
command = "docker compose ps"
category = "Docker"

[[action]]
label = "📜 Show Recent Compose Logs"
command = "docker compose logs --tail=100"
category = "Docker"