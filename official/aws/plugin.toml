[plugin]
name = "aws"
version = "0.1.0"
description = "AWS CLI helpers for SSO login, profiles, and identity checks"
author = "Chris Clines"
category = "Cloud & DevOps"

[[action]]
label = "☁️ Sign in with AWS SSO"
command = "aws sso login"
category = "AWS"

[[action]]
label = "📋 List AWS Profiles"
command = "aws configure list-profiles"
category = "AWS"

[[action]]
label = "🪪 Check AWS Caller Identity"
command = "aws sts get-caller-identity"
category = "AWS"