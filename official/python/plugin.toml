[plugin]
name = "python"
version = "0.1.0"
description = "Python virtual environment and package helpers"
author = "Chris Clines"
category = "Languages"

[[action]]
label = "🐍 Create a Local Virtual Environment"
command = "python -m venv .venv"
category = "Python"

[[action]]
label = "📦 Check Python Package Tool"
command = "python -m pip --version"
category = "Python"

[[action]]
label = "🔎 List Outdated Python Packages"
command = "python -m pip list --outdated"
category = "Python"