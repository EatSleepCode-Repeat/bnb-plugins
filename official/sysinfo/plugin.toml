[plugin]
name = "sysinfo"
version = "0.1.0"
description = "Unix-like system, disk, and process information"
author = "Chris Clines"
category = "System"

[[action]]
label = "🖥️ Operating System"
command = "uname -a"
category = "System"

[[action]]
label = "⏱️ Uptime and Load"
command = "uptime"
category = "System"

[[action]]
label = "💽 Disk Space"
command = "df -h"
category = "System"

[[action]]
label = "📊 Processes"
command = "ps -ef"
category = "System"
